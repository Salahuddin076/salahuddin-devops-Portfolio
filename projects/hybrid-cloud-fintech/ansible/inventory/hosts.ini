; Synthetic inventory. Every host below is a documentation-safe placeholder
; (RFC 5737 / RFC 1918 addresses, *.internal.example names) -- this file is
; never pointed at a real host, and ansible-playbook is never run for real
; against it (see the project README). It exists so `--syntax-check` and
; `ansible-lint` can validate the playbook and role against something with
; the shape of a real two-estate inventory.

[aws_hosts]
edge-svc-01.aws.internal.example   ansible_host=10.42.0.11
edge-svc-02.aws.internal.example   ansible_host=10.42.0.12

[onprem_hosts]
core-ledger-01.onprem.internal.example   ansible_host=198.51.100.21
core-ledger-02.onprem.internal.example   ansible_host=198.51.100.22

; Both estates get the same baseline role from site.yml. Group-specific
; variables (package manager, network interface naming) live in
; group_vars/aws_hosts.yml and group_vars/onprem_hosts.yml; everything that
; is NOT genuinely different (patch cadence, hardening rules, log-shipping
; destination) lives in group_vars/all.yml so both estates apply the same
; policy, not just the same role.
[regulated_estate:children]
aws_hosts
onprem_hosts
