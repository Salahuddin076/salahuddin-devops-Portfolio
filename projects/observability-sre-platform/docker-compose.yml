# Optional local demo: the generated rules and dashboards against synthetic
# metrics. Not needed for the tests. Ports bind to 127.0.0.1 only.
#   docker compose up -d
#   curl -X POST 'http://127.0.0.1:8080/fault?checkout_errors=0.2'
#   curl -s http://127.0.0.1:8080/alerts
#   docker compose down
name: observability-sre-demo

services:
  demo-app:
    image: python:3.12.11-slim
    command: ["python", "/app/demo_app.py", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - ./local/demo-app:/app:ro
    ports:
      - "127.0.0.1:8080:8080"
    user: "65534:65534"
    read_only: true

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./local/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./generated/prometheus:/etc/prometheus/rules:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - demo-app
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./local/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    depends_on:
      - demo-app

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./local/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./generated/grafana:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
