# Local demo only. The demo app stands in for all three services; the job
# names match the `job` the SLIs select on.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: checkout-api
    metrics_path: /metrics/checkout
    static_configs:
      - targets:
          - demo-app:8080
  - job_name: orders-worker
    metrics_path: /metrics/orders
    static_configs:
      - targets:
          - demo-app:8080
  - job_name: blackbox-website
    metrics_path: /metrics/website
    static_configs:
      - targets:
          - demo-app:8080
