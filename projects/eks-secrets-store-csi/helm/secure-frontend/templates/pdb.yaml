apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "secure-frontend.fullname" . }}
  labels:
    {{- include "secure-frontend.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "secure-frontend.selectorLabels" . | nindent 6 }}
