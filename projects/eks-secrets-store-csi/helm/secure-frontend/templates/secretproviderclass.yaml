# What ASCP fetches from Secrets Manager and how it lays the files out. The
# DB secret is one JSON document; jmesPath splits it into one file per key,
# so the app never parses JSON and a key typo fails the mount loudly
# (FailedMount) instead of yielding an empty value at run time.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "secure-frontend.fullname" . }}
  labels:
    {{- include "secure-frontend.labels" . | nindent 4 }}
spec:
  {{- include "secure-frontend.spcSpec" . | nindent 2 }}
