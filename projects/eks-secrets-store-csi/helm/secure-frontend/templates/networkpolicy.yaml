{{- if .Values.networkPolicy.enabled }}
# Default deny, then: HTTP in from the ingress namespace, DNS out. There is
# deliberately no egress to AWS APIs or to the Pod Identity agent
# (169.254.170.23): the app reads files, and ASCP (kube-system) does the
# fetching. Pod Identity still injects credentials into this pod; without a
# route to the agent they can't be exchanged (see docs/security.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "secure-frontend.fullname" . }}
  labels:
    {{- include "secure-frontend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "secure-frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
