{{- if .Values.serviceAccount.create }}
# Bound to the IAM role by aws_eks_pod_identity_association (no annotation:
# Pod Identity is configured on the cluster side, not on the SA).
#
# automountServiceAccountToken: false is safe here. The app neither calls the
# Kubernetes API nor AWS. ASCP gets a token for this SA from kubelet through
# the CSIDriver's tokenRequests, and the Pod Identity webhook injects its own
# projected token (audience pods.eks.amazonaws.com). Neither uses the default
# kube-api-access volume this setting controls.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "secure-frontend.serviceAccountName" . }}
  labels:
    {{- include "secure-frontend.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
