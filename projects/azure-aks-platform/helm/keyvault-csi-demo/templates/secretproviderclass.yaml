# What the Key Vault CSI driver mounts and how it authenticates. kubeconform
# has no bundled schema for this CRD (secrets-store.csi.x-k8s.io/v1); CI
# fetches it from the community CRD catalog instead of skipping validation
# -- see README.md "Validation" and .github/workflows/azure-aks-platform.yml.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "keyvault-csi-demo.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "keyvault-csi-demo.labels" . | nindent 4 }}
spec:
  {{- include "keyvault-csi-demo.spcSpec" . | nindent 2 }}
