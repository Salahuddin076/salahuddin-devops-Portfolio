{{- if .Values.serviceAccount.create }}
# Microsoft Entra Workload ID: the azure.workload.identity/client-id
# annotation plus Azure Policy's pod-label webhook
# (azure.workload.identity/use: "true") are what let AKS inject the
# projected service-account token volume this pod needs. There is no
# `eks.amazonaws.com/role-arn`-style annotation here because this cluster's
# cloud is Azure, not AWS -- the mechanism is the sibling pattern used in
# the AWS-flavored eks-secrets-store-csi project, not shared code with it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keyvault-csi-demo.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "keyvault-csi-demo.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.serviceAccount.azureClientId | quote }}
{{- end }}
