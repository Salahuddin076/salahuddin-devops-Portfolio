# worker: `n8n worker` pulls jobs from bull:jobs:wait and runs them. KEDA owns
# the replica count (ScaledObject), including scaling to zero.
#
# Scale-in safety. On SIGTERM n8n pauses its local queue (no new jobs), waits
# for running jobs, and force-exits after N8N_GRACEFUL_SHUTDOWN_TIMEOUT
# (verified in the image: scaling.service.js stopWorker, base-command.js).
# So: EXECUTIONS_TIMEOUT caps a run at maxExecutionSeconds, the shutdown
# timeout is that plus a buffer, and terminationGracePeriodSeconds covers the
# preStop plus the shutdown timeout plus slack before the kubelet's SIGKILL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "n8n.fullname" . }}-worker
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
    {{- include "n8n.selectorLabels" (dict "root" . "component" "worker") | nindent 4 }}
  annotations:
    n8n.example.com/max-execution-seconds: {{ .Values.executions.maxExecutionSeconds | quote }}
spec:
  # No replicas field: KEDA's HPA owns it (0..maxReplicaCount).
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      {{- include "n8n.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "n8n.podLabels" . | nindent 8 }}
        {{- include "n8n.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/secretproviderclass: {{ include "n8n.spcSpec" . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ include "n8n.workerGracePeriod" . }}
      securityContext:
        {{- include "n8n.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "n8n.selectorLabels" (dict "root" . "component" "worker") | nindent 14 }}
      containers:
        - name: n8n
          image: {{ include "n8n.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker", "--concurrency={{ .Values.worker.concurrency }}"]
          ports:
            # The worker's health/metrics server (QUEUE_HEALTH_CHECK_ACTIVE).
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            {{- include "n8n.sharedEnv" . | nindent 12 }}
            - name: QUEUE_HEALTH_CHECK_ACTIVE
              value: "true"
            - name: QUEUE_HEALTH_CHECK_PORT
              value: {{ .Values.containerPort | quote }}
            - name: N8N_GRACEFUL_SHUTDOWN_TIMEOUT
              value: {{ include "n8n.workerShutdownSeconds" . | quote }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.worker.preStopSleepSeconds }}
          {{- include "n8n.probes" (dict) | nindent 10 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- include "n8n.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "n8n.writableMounts" . | nindent 12 }}
      volumes:
        {{- include "n8n.volumes" . | nindent 8 }}
