# One ServiceAccount for main, webhook and worker: the Pod Identity
# association in Terraform maps it to a role that can read exactly the three
# n8n secrets. ASCP uses it to fetch them; n8n itself never calls AWS.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
automountServiceAccountToken: false
