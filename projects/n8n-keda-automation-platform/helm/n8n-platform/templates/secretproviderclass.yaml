# Encryption key, DB application credentials (JSON split by jmesPath) and the
# Redis AUTH token, as files under secrets.mountPath. No secretObjects: nothing
# is synced into a Kubernetes Secret (KEDA reads the Redis token straight from
# Secrets Manager, ADR 0003).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "n8n.fullname" . }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
spec:
  {{- include "n8n.spcSpec" . | nindent 2 }}
