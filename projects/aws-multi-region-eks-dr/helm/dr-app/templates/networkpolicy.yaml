{{- if .Values.networkPolicy.enabled }}
# Enforced by the VPC CNI's network policy agent (enableNetworkPolicy=true on
# the vpc-cni add-on in Terraform). Without it these objects are inert.
#
# 1. Default deny: no ingress to any pod of this release, and no egress
#    except what policy 3 allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dr-app.fullname" . }}-default-deny
  labels:
    {{- include "dr-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
---
# 2. The ALB (target-type ip) reaches API pods directly on the container port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dr-app.fullname" . }}-api-from-alb
  labels:
    {{- include "dr-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dr-app.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.albSourceCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.containerPort }}
---
# 3. Egress: cluster DNS, Aurora and Valkey in the data subnets, the EKS Pod
#    Identity agent, and (optionally) HTTPS to AWS APIs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dr-app.fullname" . }}-egress
  labels:
    {{- include "dr-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        {{- range .Values.networkPolicy.dataSubnetCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - protocol: TCP
          port: 80
    {{- if .Values.networkPolicy.awsApiEgress }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
