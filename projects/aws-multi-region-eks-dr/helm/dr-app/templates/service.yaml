apiVersion: v1
kind: Service
metadata:
  name: {{ include "dr-app.fullname" . }}-api
  labels:
    {{- include "dr-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "dr-app.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
