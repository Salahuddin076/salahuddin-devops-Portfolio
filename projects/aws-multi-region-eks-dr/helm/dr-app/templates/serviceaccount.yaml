{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dr-app.serviceAccountName" . }}
  labels:
    {{- include "dr-app.labels" . | nindent 4 }}
# No IRSA annotation: credentials come from the EKS Pod Identity association
# for this namespace and name. The Pod Identity webhook injects its own
# projected token, so the default API token is not mounted.
automountServiceAccountToken: false
{{- end }}
