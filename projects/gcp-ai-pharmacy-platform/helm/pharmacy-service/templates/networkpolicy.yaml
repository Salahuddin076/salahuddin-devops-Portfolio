{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pharmacy-service.name" . }}
  labels:
    {{- include "pharmacy-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pharmacy-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - port: {{ .Values.containerPort }}
  egress:
    # DNS.
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Cloud SQL private IP and Google API endpoints (Secret Manager, Artifact
    # Registry, Workload Identity metadata exchange) -- all reachable only
    # inside the VPC or via Private Google Access, never over the public
    # internet.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 5432
          protocol: TCP
{{- end }}
