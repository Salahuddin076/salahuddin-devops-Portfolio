{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "pharmacy-service.labels" . | nindent 4 }}
  annotations:
    # This is the entire Workload Identity binding on the Kubernetes side:
    # GKE's webhook mutates pods using this ServiceAccount to present
    # credentials for the named Google service account, via the metadata
    # server, with no key file ever created or mounted. The matching IAM side
    # is google_service_account_iam_member.workload_identity in
    # terraform/modules/gke-cluster/main.tf.
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccountEmail }}
{{- end }}
