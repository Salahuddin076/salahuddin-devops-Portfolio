apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pharmacy-service.name" . }}
  labels:
    {{- include "pharmacy-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pharmacy-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pharmacy-service.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # Belt-and-suspenders with the taint/toleration pair below: even if a
      # future node pool forgets the taint, this still keeps the pod off any
      # node whose label doesn't say it's this workload's pool.
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ include "pharmacy-service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            - name: WORKLOAD
              value: {{ .Values.workload }}
            # The app resolves this secret *name* through the Secret Manager
            # client library using the pod's Workload Identity credentials --
            # no secret value is ever an env var or a mounted file written by
            # this chart.
            - name: SECRET_MANAGER_SECRET_NAME
              value: {{ .Values.secrets.name }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
