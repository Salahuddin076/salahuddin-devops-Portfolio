{{- if .Values.canary.enabled }}
# A second, small Deployment on a different architecture, sharing the stable
# Deployment's Service (see service.yaml: the selector has no "pool" label).
# There's no service mesh here, so this is a replica-count canary: the share
# of requests it gets is roughly replicaCount / (replicaCount + stable
# replicaCount), not a configured percentage. Good enough to prove the
# Graviton pool under real traffic before widening it; see
# docs/operations.md for the rollout sequence and this limitation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "multiarch-app.fullname" . }}-canary
  labels:
    {{- include "multiarch-app.labels" . | nindent 4 }}
    app.kubernetes.io/pool: canary
spec:
  replicas: {{ .Values.canary.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "multiarch-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/pool: canary
  template:
    metadata:
      labels:
        {{- include "multiarch-app.labels" . | nindent 8 }}
        app.kubernetes.io/pool: canary
    spec:
      serviceAccountName: {{ include "multiarch-app.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "multiarch-app.podSecurityContext" . | nindent 8 }}
      nodeSelector:
        kubernetes.io/arch: {{ .Values.canary.architecture | quote }}
      affinity:
        {{- include "multiarch-app.archAffinity" (dict "arch" .Values.canary.architecture "preferred" .Values.affinity.preferred) | nindent 8 }}
      {{- with .Values.nodeToleration }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "multiarch-app.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/pool: canary
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: POOL
              value: canary
            - name: ARCH
              value: {{ .Values.canary.architecture | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "multiarch-app.containerSecurityContext" . | nindent 12 }}
{{- end }}
