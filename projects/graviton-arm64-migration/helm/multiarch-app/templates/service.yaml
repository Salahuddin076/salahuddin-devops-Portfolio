apiVersion: v1
kind: Service
metadata:
  name: {{ include "multiarch-app.fullname" . }}
  labels:
    {{- include "multiarch-app.labels" . | nindent 4 }}
spec:
  # No "pool" label here on purpose: this Service balances across the
  # stable Deployment's pods and, when canary.enabled, the canary
  # Deployment's pods too. Disabling the canary (or scaling it to 0) removes
  # it from the endpoint list with no Service change.
  selector:
    {{- include "multiarch-app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
