# EXAMPLE ONLY. This file documents the app repository's CI; it is not active in
# the portfolio monorepo (GitHub only runs workflows from the repo-root
# .github/workflows). It is linted by check_workflows.py like a real workflow.
#
# Flow: test -> build and push ghcr.io/example-org/orders-api:<git sha> ->
# open a PR against the config repository that bumps envs/dev/values.yaml.
# CI never talks to a cluster; Argo CD pulls the merged change.
---
name: orders-api-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: orders-api-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/example-org/orders-api
  CONFIG_REPO: example-org/orders-config

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: unittest (stdlib only)
        run: python -m unittest discover -s tests -v

  build:
    name: Build and push the image (immutable SHA tag)
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Image tag is the full commit SHA (never latest)
        id: tag
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: APP_VERSION=${{ steps.tag.outputs.tag }}
          provenance: true
          sbom: true

  bump-dev:
    name: Open a PR on the config repo (envs/dev image.tag)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # A GitHub App installed only on the config repo, with contents + pull-requests
      # write there. No cluster credentials exist anywhere in this workflow.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.CONFIG_BOT_APP_ID }}
          private-key: ${{ secrets.CONFIG_BOT_PRIVATE_KEY }}
          owner: example-org
          repositories: orders-config
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.CONFIG_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          path: config
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Set envs/dev image.tag and write the PR body
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          python config/scripts/promote.py --config-repo config \
            --tag "${IMAGE_TAG}" --to dev --pr-body "${RUNNER_TEMP}/pr-body.md"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: config
          token: ${{ steps.app-token.outputs.token }}
          branch: bump/dev-${{ needs.build.outputs.tag }}
          commit-message: "dev: orders-api image.tag -> ${{ needs.build.outputs.tag }}"
          title: "dev: deploy orders-api ${{ needs.build.outputs.tag }}"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: promotion,env/dev
          delete-branch: true
