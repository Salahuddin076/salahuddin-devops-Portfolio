# Source: orders-api/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/instance: orders-api
    app.kubernetes.io/version: "9f3c2a7e5b1d4c8f6a0e2b7d9c1f3a5e7b9d0c2e"
    app.kubernetes.io/part-of: gitops-delivery-platform
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: orders-api-1.3.0
    example.com/environment: dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orders-api
      app.kubernetes.io/instance: orders-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: http
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 10.20.0.0/16
      ports:
        - port: 5432
          protocol: TCP

