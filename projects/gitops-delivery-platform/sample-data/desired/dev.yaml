# Source: orders-api/templates/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/instance: orders-api
    app.kubernetes.io/version: "9f3c2a7e5b1d4c8f6a0e2b7d9c1f3a5e7b9d0c2e"
    app.kubernetes.io/part-of: gitops-delivery-platform
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: orders-api-1.3.0
    example.com/environment: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-dev
  target:
    name: orders-api-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: example/orders-api/dev/database
        property: url

---
# Source: orders-api/templates/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/instance: orders-api
    app.kubernetes.io/version: "9f3c2a7e5b1d4c8f6a0e2b7d9c1f3a5e7b9d0c2e"
    app.kubernetes.io/part-of: gitops-delivery-platform
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: orders-api-1.3.0
    example.com/environment: dev
spec:
  # job="orders-api" in Prometheus, as the analysis query expects.
  jobLabel: app.kubernetes.io/name
  # Copies the Rollouts pod hash onto every series so canary pods can be selected
  # (Prometheus sanitizes it to rollouts_pod_template_hash).
  podTargetLabels:
    - rollouts-pod-template-hash
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
      app.kubernetes.io/instance: orders-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
