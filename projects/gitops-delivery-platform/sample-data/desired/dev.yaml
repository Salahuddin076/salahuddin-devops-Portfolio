# Source: orders-api/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/instance: orders-api
    app.kubernetes.io/version: "9f3c2a7e5b1d4c8f6a0e2b7d9c1f3a5e7b9d0c2e"
    app.kubernetes.io/part-of: gitops-delivery-platform
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: orders-api-1.3.0
    example.com/environment: dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orders-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
# Source: orders-api/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/instance: orders-api
    app.kubernetes.io/version: "9f3c2a7e5b1d4c8f6a0e2b7d9c1f3a5e7b9d0c2e"
    app.kubernetes.io/part-of: gitops-delivery-platform
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: orders-api-1.3.0
    example.com/environment: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-example
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - orders.dev.example.com
      secretName: orders-api-tls
  rules:
    - host: orders.dev.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orders-api
                port:
                  name: http

