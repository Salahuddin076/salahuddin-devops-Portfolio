# Source: orders-api/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/instance: orders-api
    app.kubernetes.io/version: "9f3c2a7e5b1d4c8f6a0e2b7d9c1f3a5e7b9d0c2e"
    app.kubernetes.io/part-of: gitops-delivery-platform
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: orders-api-1.3.0
    example.com/environment: dev
spec:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
      app.kubernetes.io/instance: orders-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api
        app.kubernetes.io/instance: orders-api
        app.kubernetes.io/version: "9f3c2a7e5b1d4c8f6a0e2b7d9c1f3a5e7b9d0c2e"
        app.kubernetes.io/part-of: gitops-delivery-platform
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: orders-api-1.3.0
        example.com/environment: dev
    spec:
      serviceAccountName: orders-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: orders-api
              app.kubernetes.io/instance: orders-api
      containers:
        - name: orders-api
          image: ghcr.io/example-org/orders-api:9f3c2a7e5b1d4c8f6a0e2b7d9c1f3a5e7b9d0c2e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: APP_ENV
              value: "dev"
            - name: APP_VERSION
              value: "9f3c2a7e5b1d4c8f6a0e2b7d9c1f3a5e7b9d0c2e"
            - name: PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: orders-api-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

