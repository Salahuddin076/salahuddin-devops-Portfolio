# One namespace per environment, Pod Security Admission "restricted".
# Created by the platform project so the orders-api project needs no
# cluster-scoped permissions (no CreateNamespace=true).
apiVersion: v1
kind: Namespace
metadata:
  name: orders-dev
  labels:
    example.com/environment: dev
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: orders-staging
  labels:
    example.com/environment: staging
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: orders-prod
  labels:
    example.com/environment: prod
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
