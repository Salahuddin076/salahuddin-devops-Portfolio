# One store per environment. Each assumes a role that can read only
# example/orders-api/<env>/* and accepts ExternalSecrets only from its own
# namespace (conditions), so dev cannot read prod secrets. The controller's
# base credentials come from EKS Pod Identity (no static keys).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager-dev
spec:
  conditions:
    - namespaces:
        - orders-dev
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      role: arn:aws:iam::123456789012:role/example-eso-orders-dev
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager-staging
spec:
  conditions:
    - namespaces:
        - orders-staging
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      role: arn:aws:iam::123456789012:role/example-eso-orders-staging
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager-prod
spec:
  conditions:
    - namespaces:
        - orders-prod
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      role: arn:aws:iam::123456789012:role/example-eso-orders-prod
