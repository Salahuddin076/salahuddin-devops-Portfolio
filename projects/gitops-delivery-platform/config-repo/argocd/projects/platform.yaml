# Platform team's project: Argo CD's own objects, the orders namespaces and the
# ClusterSecretStores. The only project allowed to touch cluster-scoped kinds,
# and only these.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Argo CD configuration and shared platform resources
  sourceRepos:
    - https://github.com/example-org/orders-config.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: external-secrets
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: external-secrets.io
      kind: ClusterSecretStore
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: AppProject
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: ApplicationSet
  roles:
    - name: admin
      description: Platform engineers.
      groups:
        - example-org:platform-admins
      policies:
        - p, proj:platform:admin, applications, *, platform/*, allow
