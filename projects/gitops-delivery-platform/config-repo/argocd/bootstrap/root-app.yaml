# App of apps. Applied once by hand during bootstrap (docs/operations.md);
# from then on everything under argocd/ (except this folder) is managed from git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.slack: platform-alerts
spec:
  project: platform
  source:
    repoURL: https://github.com/example-org/orders-config.git
    targetRevision: main
    path: argocd
    directory:
      recurse: true
      exclude: "bootstrap/*"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
