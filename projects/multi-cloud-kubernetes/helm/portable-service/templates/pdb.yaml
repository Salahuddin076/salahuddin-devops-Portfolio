apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "portable-service.name" . }}
  labels:
    {{- include "portable-service.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "portable-service.selectorLabels" . | nindent 6 }}
