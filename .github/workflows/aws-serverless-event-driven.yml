name: aws-serverless-event-driven

on:
  push:
    paths:
      - "projects/aws-serverless-event-driven/**"
      - ".github/workflows/aws-serverless-event-driven.yml"
  pull_request:
    paths:
      - "projects/aws-serverless-event-driven/**"
      - ".github/workflows/aws-serverless-event-driven.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-serverless-event-driven-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/aws-serverless-event-driven

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Unit tests (stdlib unittest, no dependencies, no boto3)
        run: python -m unittest discover -s tests -v

  local-demo:
    name: Local end-to-end demo
    runs-on: ubuntu-latest
    needs: python-tests
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run the pipeline in-process (self-checks fail the job)
        run: python scripts/local_demo.py --show-logs

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.8"
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform
      - name: validate module
        run: |
          terraform -chdir=terraform/modules/order-pipeline init -backend=false -input=false
          terraform -chdir=terraform/modules/order-pipeline validate
      - name: validate example
        run: |
          terraform -chdir=terraform/examples/basic init -backend=false -input=false
          terraform -chdir=terraform/examples/basic validate
