---
name: gitops-delivery-platform

on:
  push:
    paths:
      - "projects/gitops-delivery-platform/**"
      - ".github/workflows/gitops-delivery-platform.yml"
  pull_request:
    paths:
      - "projects/gitops-delivery-platform/**"
      - ".github/workflows/gitops-delivery-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-delivery-platform-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/gitops-delivery-platform

env:
  HELM_VERSION: "4.3.0"
  HELM_SHA256: "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb"
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  KUBERNETES_VERSION: "1.34.0"
  # Rollout, AnalysisTemplate, Application, ApplicationSet, AppProject, ExternalSecret,
  # ClusterSecretStore and ServiceMonitor are CRDs: schemas come from the community CRD catalog.
  CRD_SCHEMA_LOCATION: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

jobs:
  python-tests:
    name: Python unit tests (promote, drift, policy, app)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The rendered-chart and kubeconform tests skip here (no helm); the helm job runs them.
      - name: Unit tests (stdlib unittest, no dependencies)
        run: python -m unittest discover -s tests -v

  policy:
    name: GitOps policy + drift sample
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: check_gitops_policy.py on the config repo (warnings fail too)
        run: python scripts/check_gitops_policy.py --fail-on warning
      - name: check_gitops_policy.py must reject the bad fixture
        run: |
          if python scripts/check_gitops_policy.py --config-repo tests/fixtures/policy/bad; then
            echo "the bad fixture passed the policy check" >&2
            exit 1
          fi
      - name: Drift report on the shipped samples (clean exits 0, drifted exits 1)
        run: |
          python scripts/drift_report.py --desired sample-data/desired/dev.yaml --live sample-data/live/dev-in-sync.json
          set +e
          python scripts/drift_report.py --desired sample-data/desired/dev.yaml --live sample-data/live/dev-drifted.json
          test "$?" -eq 1

  helm:
    name: Helm lint + kubeconform (each env, argocd/, platform/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned helm and kubeconform (checksum-verified)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform
          mkdir -p bin
          mv linux-amd64/helm kubeconform bin/
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: helm lint (each environment's values)
        working-directory: projects/gitops-delivery-platform/config-repo
        run: |
          set -euo pipefail
          for env in dev staging prod; do
            helm lint charts/orders-api -f "envs/${env}/values.yaml"
          done
      - name: kubeconform -strict on each env render (Rollout, AnalysisTemplate, ExternalSecret via the catalog)
        working-directory: projects/gitops-delivery-platform/config-repo
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/kubeconform-cache"
          for env in dev staging prod; do
            echo "== ${env}"
            helm template orders-api charts/orders-api --namespace "orders-${env}" -f "envs/${env}/values.yaml" \
              | kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}" \
                  -cache "${RUNNER_TEMP}/kubeconform-cache" \
                  -schema-location default -schema-location "${CRD_SCHEMA_LOCATION}"
          done
      - name: kubeconform -strict on argocd/ (Application, ApplicationSet, AppProject via the catalog)
        working-directory: projects/gitops-delivery-platform/config-repo
        run: |
          kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}" \
            -cache "${RUNNER_TEMP}/kubeconform-cache" \
            -schema-location default -schema-location "${CRD_SCHEMA_LOCATION}" argocd/
      - name: kubeconform -strict on platform/ (catalog ClusterSecretStore schema, repaired)
        run: |
          set -euo pipefail
          python scripts/patch_catalog_schema.py --out "${RUNNER_TEMP}/patched-schemas" \
            external-secrets.io/clustersecretstore_v1
          kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}" \
            -cache "${RUNNER_TEMP}/kubeconform-cache" \
            -schema-location default \
            -schema-location "${RUNNER_TEMP}/patched-schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            -schema-location "${CRD_SCHEMA_LOCATION}" config-repo/platform/
      - name: Rendered-chart and kubeconform tests
        run: python -m unittest discover -s tests -p 'test_helm_static.py' -v

  workflow-lint:
    name: Workflow hardening lint (this workflow + the app repo example)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: check_workflows.py (fail on warnings too)
        run: |
          python projects/devsecops-pipeline/policy/check_workflows.py --fail-on warning \
            .github/workflows/gitops-delivery-platform.yml \
            projects/gitops-delivery-platform/app-repo/.github/workflows/ci.yml
