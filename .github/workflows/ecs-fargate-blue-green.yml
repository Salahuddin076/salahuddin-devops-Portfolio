name: ecs-fargate-blue-green

on:
  push:
    paths:
      - "projects/ecs-fargate-blue-green/**"
      - ".github/workflows/ecs-fargate-blue-green.yml"
  pull_request:
    paths:
      - "projects/ecs-fargate-blue-green/**"
      - ".github/workflows/ecs-fargate-blue-green.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecs-fargate-blue-green-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/ecs-fargate-blue-green

jobs:
  python-tests:
    name: Python unit tests + blue/green policy lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Unit tests (stdlib unittest, no dependencies)
        run: python -m unittest discover -s tests -v
      - name: Policy lint (real environment settings must pass)
        run: python scripts/check_bluegreen_policy.py
      - name: Policy lint (every bad fixture must fail)
        run: |
          for f in tests/fixtures/bad-*.json; do
            if python scripts/check_bluegreen_policy.py "$f"; then
              echo "::error file=$f::expected the policy lint to fail on $f"
              exit 1
            fi
          done
      - name: Render the example release artifacts
        run: python scripts/render_appspec.py --values deploy/values.example.json --out-dir build

  terraform:
    name: Terraform fmt + validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir:
          - modules/shared-platform
          - modules/ecs-service-bluegreen
          - environments/shared
          - environments/dev
          - environments/staging
          - environments/prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.8"
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform
      - name: terraform init + validate
        run: |
          terraform -chdir=terraform/${{ matrix.dir }} init -backend=false -input=false
          terraform -chdir=terraform/${{ matrix.dir }} validate

  docker-build:
    name: Docker buildx linux/arm64 build + smoke test (no push)
    runs-on: ubuntu-latest
    needs: python-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build for Graviton
        run: |
          docker buildx build --platform linux/arm64 \
            --build-arg APP_VERSION="$(cat app/VERSION)" \
            --build-arg IMAGE_TAG="${GITHUB_SHA}" \
            --load -t "bluegreen-api:${GITHUB_SHA}" app
      - name: Run it (emulated) read-only and probe it
        run: |
          docker image inspect -f '{{.Architecture}}' "bluegreen-api:${GITHUB_SHA}" | grep -qx arm64
          docker run -d --name app --platform linux/arm64 --read-only -p 8080:8080 "bluegreen-api:${GITHUB_SHA}"
          for i in $(seq 1 60); do
            curl -fsS localhost:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS localhost:8080/version | grep -q "${GITHUB_SHA}"
          test "$(docker exec app id -u)" = "10001"
      - name: Container logs
        if: always()
        run: docker logs app || true
