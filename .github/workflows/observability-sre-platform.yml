---
name: observability-sre-platform

on:
  push:
    paths:
      - "projects/observability-sre-platform/**"
      - ".github/workflows/observability-sre-platform.yml"
  pull_request:
    paths:
      - "projects/observability-sre-platform/**"
      - ".github/workflows/observability-sre-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-sre-platform-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/observability-sre-platform

env:
  HELM_VERSION: "4.3.0"
  HELM_SHA256: "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb"
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  KUBERNETES_VERSION: "1.34.0"
  PROMETHEUS_IMAGE: "prom/prometheus:v3.5.0"
  # PrometheusRule, ServiceMonitor, Probe and AlertmanagerConfig are CRDs:
  # their schemas come from the community CRD catalog.
  CRD_SCHEMA_LOCATION: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

jobs:
  python-tests:
    name: Python unit tests + generated output is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The helm and promtool tests skip here (no helm, image not pulled); their jobs run them.
      - name: Unit tests (stdlib unittest, no dependencies)
        run: python -m unittest discover -s tests -v
      - name: Regenerate, then fail on any diff in generated/
        working-directory: .
        run: |
          python projects/observability-sre-platform/generator/slogen.py generate
          git diff --exit-code -- projects/observability-sre-platform/generated
          test -z "$(git status --porcelain -- projects/observability-sre-platform/generated)"
      - name: Error-budget report on the sample
        run: python generator/slogen.py report sample-data/checkout-api-availability-hourly.csv --slo slo/checkout-api.json --name availability

  promtool:
    name: promtool check + test rules (pinned Prometheus image)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: promtool check rules
        run: |
          docker run --rm --network none -v "$PWD:/work:ro" -w /work --entrypoint promtool \
            "${PROMETHEUS_IMAGE}" check rules generated/prometheus/*.rules.yml
      - name: promtool test rules
        run: |
          docker run --rm --network none -v "$PWD:/work:ro" -w /work --entrypoint promtool \
            "${PROMETHEUS_IMAGE}" test rules tests/promtool/slo-alerts.test.yml

  helm:
    name: Helm lint + kubeconform (chart and generated PrometheusRules)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned helm and kubeconform (checksum-verified)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform
          mkdir -p bin
          mv linux-amd64/helm kubeconform bin/
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: helm lint
        run: helm lint helm/observability-stack
      - name: kubeconform -strict, CRDs included (CRD catalog schemas)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/kubeconform-cache"
          helm template obs helm/observability-stack --namespace observability \
            | kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}" \
                -cache "${RUNNER_TEMP}/kubeconform-cache" \
                -schema-location default -schema-location "${CRD_SCHEMA_LOCATION}"
          kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}" \
            -cache "${RUNNER_TEMP}/kubeconform-cache" \
            -schema-location default -schema-location "${CRD_SCHEMA_LOCATION}" generated/kubernetes/
      - name: Rendered-chart tests
        run: python -m unittest discover -s tests -p 'test_helm_static.py' -v

  workflow-lint:
    name: Workflow hardening lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: check_workflows.py on this workflow (fail on warnings too)
        run: python projects/devsecops-pipeline/policy/check_workflows.py .github/workflows/observability-sre-platform.yml --fail-on warning
