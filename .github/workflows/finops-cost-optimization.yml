name: finops-cost-optimization

on:
  push:
    paths:
      - "projects/finops-cost-optimization/**"
      - ".github/workflows/finops-cost-optimization.yml"
  pull_request:
    paths:
      - "projects/finops-cost-optimization/**"
      - ".github/workflows/finops-cost-optimization.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finops-cost-optimization-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/finops-cost-optimization

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Unit tests (stdlib unittest, no dependencies)
        run: python -m unittest discover -s tests -v
      - name: Sample data is reproducible from the seed
        run: |
          python -m finops generate --out sample-data --seed 42 --start 2026-07-01 --days 90
          git diff --exit-code -- sample-data

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.8"
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform
      - name: validate module
        run: |
          terraform -chdir=terraform/modules/cost-guardrails init -backend=false -input=false
          terraform -chdir=terraform/modules/cost-guardrails validate
      - name: validate example
        run: |
          terraform -chdir=terraform/examples/basic init -backend=false -input=false
          terraform -chdir=terraform/examples/basic validate

  report:
    name: Generate report
    runs-on: ubuntu-latest
    needs: python-tests
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build report from synthetic sample data
        run: python -m finops report --input sample-data --budget 6500 --out out --html
      - name: Budget gate (forecast must stay under 100% of budget)
        run: python -m finops budget --input sample-data --budget 6500 --fail-at 100 --measure forecast
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finops-report
          path: projects/finops-cost-optimization/out/
          retention-days: 14
          if-no-files-found: error
