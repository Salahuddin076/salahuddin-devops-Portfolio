name: graviton-arm64-migration

on:
  push:
    paths:
      - "projects/graviton-arm64-migration/**"
      - ".github/workflows/graviton-arm64-migration.yml"
  pull_request:
    paths:
      - "projects/graviton-arm64-migration/**"
      - ".github/workflows/graviton-arm64-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graviton-arm64-migration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/graviton-arm64-migration

env:
  HELM_VERSION: "4.3.0"
  HELM_SHA256: "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb"
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  KUBERNETES_VERSION: "1.34.0"

jobs:
  python-tests:
    name: Python unit tests (compatibility checker, terraform/helm statics)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The rendered-chart tests skip here (no helm); the helm job runs them.
      - name: Unit tests (stdlib unittest, no dependencies)
        run: python -m unittest discover -s tests -v
      - name: Compatibility manifest gate (same command the rollout runbook uses)
        run: python scripts/compatibility_check.py --fail-on warning

  helm:
    name: Helm lint + kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned helm and kubeconform (checksum-verified)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform
          mkdir -p bin
          mv linux-amd64/helm kubeconform bin/
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: helm lint (stable and canary-enabled values)
        run: |
          helm lint helm/multiarch-app
          helm lint helm/multiarch-app --set canary.enabled=true
      - name: kubeconform -strict, stable and canary-enabled
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/kubeconform-cache"
          for canary in false true; do
            echo "== canary.enabled=${canary}"
            helm template multiarch-app helm/multiarch-app --namespace web --set "canary.enabled=${canary}" \
              | kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}" \
                  -cache "${RUNNER_TEMP}/kubeconform-cache"
          done
      - name: Rendered-chart tests (nodeSelector/affinity, canary pool, PDB, hardening)
        run: python -m unittest discover -s tests -p 'test_helm_static.py' -v

  terraform:
    name: Terraform fmt + validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir:
          - terraform/modules/eks-arch-node-group
          - terraform/modules/ecr-multiarch
          - terraform/examples/mixed-fleet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.8"
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform
      - name: terraform init
        run: terraform -chdir="${{ matrix.dir }}" init -backend=false -input=false
      - name: terraform validate
        run: terraform -chdir="${{ matrix.dir }}" validate
      - name: Terraform static invariant tests
        if: matrix.dir == 'terraform/modules/eks-arch-node-group'
        run: python3 -m unittest discover -s tests -p 'test_terraform_static.py' -v
        working-directory: projects/graviton-arm64-migration

  workflow-lint:
    name: Workflow hardening lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: check_workflows.py on this workflow (fail on warnings too)
        run: python projects/devsecops-pipeline/policy/check_workflows.py .github/workflows/graviton-arm64-migration.yml --fail-on warning
