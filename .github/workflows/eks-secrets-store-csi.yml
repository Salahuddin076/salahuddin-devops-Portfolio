name: eks-secrets-store-csi

on:
  push:
    paths:
      - "projects/eks-secrets-store-csi/**"
      - ".github/workflows/eks-secrets-store-csi.yml"
  pull_request:
    paths:
      - "projects/eks-secrets-store-csi/**"
      - ".github/workflows/eks-secrets-store-csi.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eks-secrets-store-csi-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/eks-secrets-store-csi

env:
  HELM_VERSION: "4.3.0"
  HELM_SHA256: "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb"
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  KUBERNETES_VERSION: "1.34.0"
  # SecretProviderClass is a CRD: its schema comes from the community CRD catalog.
  CRD_SCHEMA_LOCATION: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

jobs:
  python-tests:
    name: Python unit tests (app, scanners, rotation drill)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The rendered-chart tests skip here (no helm); the helm job runs them.
      - name: Unit tests (stdlib unittest, no dependencies)
        run: python -m unittest discover -s tests -v
      - name: Rotation drill (real app subprocess, atomic file swap)
        run: python scripts/secret_rotation_drill.py --timeout 20 --app-poll 0.5

  secret-scan:
    name: Hard-coded secret detector
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: find_hardcoded_secrets.py on this project (allowlist entries need a reason)
        run: python scripts/find_hardcoded_secrets.py .

  helm:
    name: Helm lint + kubeconform + manifest policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned helm and kubeconform (checksum-verified)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform
          mkdir -p bin
          mv linux-amd64/helm kubeconform bin/
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: helm lint (default and sync-enabled values)
        run: |
          helm lint helm/secure-frontend
          helm lint helm/secure-frontend --set secrets.sync.enabled=true
      - name: kubeconform -strict, SecretProviderClass included (CRD catalog schema)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/kubeconform-cache"
          for sync in false true; do
            echo "== secrets.sync.enabled=${sync}"
            helm template secure-frontend helm/secure-frontend --namespace web --set "secrets.sync.enabled=${sync}" \
              | kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}" \
                  -cache "${RUNNER_TEMP}/kubeconform-cache" \
                  -schema-location default -schema-location "${CRD_SCHEMA_LOCATION}"
          done
      - name: scan_manifests.py on the rendered chart (errors fail; sync=true only warns)
        run: |
          set -euo pipefail
          helm template secure-frontend helm/secure-frontend --namespace web \
            | python scripts/scan_manifests.py - --fail-on warning
          helm template secure-frontend helm/secure-frontend --namespace web --set secrets.sync.enabled=true \
            | python scripts/scan_manifests.py - --fail-on error
      - name: Rendered-chart tests (SPC, read-only mount, hardening, PDB, NetworkPolicy)
        run: python -m unittest discover -s tests -p 'test_helm_static.py' -v

  terraform:
    name: Terraform fmt + validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir:
          - terraform/modules/secrets-store-csi
          - terraform/examples/basic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.8"
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform
      - name: terraform init
        run: terraform -chdir="${{ matrix.dir }}" init -backend=false -input=false
      - name: terraform validate
        run: terraform -chdir="${{ matrix.dir }}" validate

  workflow-lint:
    name: Workflow hardening lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: check_workflows.py on this workflow (fail on warnings too)
        run: python projects/devsecops-pipeline/policy/check_workflows.py .github/workflows/eks-secrets-store-csi.yml --fail-on warning
