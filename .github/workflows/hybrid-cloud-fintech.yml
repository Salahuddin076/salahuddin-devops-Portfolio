name: hybrid-cloud-fintech

on:
  push:
    paths:
      - "projects/hybrid-cloud-fintech/**"
      - ".github/workflows/hybrid-cloud-fintech.yml"
  pull_request:
    paths:
      - "projects/hybrid-cloud-fintech/**"
      - ".github/workflows/hybrid-cloud-fintech.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hybrid-cloud-fintech-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/hybrid-cloud-fintech

jobs:
  python-tests:
    name: Python unit tests (degrade pattern + Terraform/Ansible statics)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Unit tests (stdlib unittest, no dependencies, no network calls)
        run: python -m unittest discover -s tests -v

  local-demo:
    name: Graceful-degradation local demo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run the deterministic degrade/replay demo
        run: |
          python scripts/local_demo.py | tee demo-output.txt
          grep -q "all_drained=True" demo-output.txt

  terraform:
    name: Terraform fmt + validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir:
          - terraform/modules/connectivity
          - terraform/modules/segmentation
          - terraform/examples/reference
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.8"
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform
      - name: terraform init
        run: terraform -chdir="${{ matrix.dir }}" init -backend=false -input=false
      - name: terraform validate
        run: terraform -chdir="${{ matrix.dir }}" validate

  ansible:
    name: Ansible syntax-check + lint (synthetic inventory, never applied)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ansible-core, ansible-lint and the ansible.posix collection
        run: |
          python -m pip install --quiet ansible-core ansible-lint
          ansible-galaxy collection install ansible.posix
      - name: ansible-playbook --syntax-check
        working-directory: projects/hybrid-cloud-fintech/ansible
        run: ansible-playbook --syntax-check site.yml
      - name: ansible-lint
        working-directory: projects/hybrid-cloud-fintech/ansible
        run: ansible-lint site.yml
