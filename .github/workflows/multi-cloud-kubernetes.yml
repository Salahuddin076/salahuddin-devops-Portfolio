name: multi-cloud-kubernetes

on:
  push:
    paths:
      - "projects/multi-cloud-kubernetes/**"
      - ".github/workflows/multi-cloud-kubernetes.yml"
  pull_request:
    paths:
      - "projects/multi-cloud-kubernetes/**"
      - ".github/workflows/multi-cloud-kubernetes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multi-cloud-kubernetes-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/multi-cloud-kubernetes

env:
  HELM_VERSION: "4.3.0"
  HELM_SHA256: "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb"
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  KUBERNETES_VERSION: "1.34.0"

jobs:
  python-tests:
    name: Python unit tests (helm/terraform/argocd/comparison/docs statics)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Unit tests (stdlib unittest, no dependencies, no cloud calls)
        run: python -m unittest discover -s tests -v

  helm:
    name: Helm lint + kubeconform (portable-service, all 3 overlays)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cloud: [eks, aks, gke]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned helm and kubeconform (checksum-verified)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform
          mkdir -p bin
          mv linux-amd64/helm kubeconform bin/
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: helm lint (${{ matrix.cloud }})
        run: helm lint helm/portable-service -f "helm/portable-service/values-${{ matrix.cloud }}.yaml"
      - name: kubeconform -strict (${{ matrix.cloud }})
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/kubeconform-cache"
          helm template portable-service helm/portable-service -n portable-service \
              -f "helm/portable-service/values-${{ matrix.cloud }}.yaml" \
            | kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}" \
                -cache "${RUNNER_TEMP}/kubeconform-cache"

  argocd:
    name: kubeconform (argocd/, CRD schema from the community catalog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned kubeconform (checksum-verified)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform
          mkdir -p bin
          mv kubeconform bin/
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: kubeconform -strict argocd/
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/kubeconform-cache"
          kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}" \
              -cache "${RUNNER_TEMP}/kubeconform-cache" \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              argocd/

  terraform:
    name: Terraform fmt + validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir:
          - terraform/modules/identity-bindings
          - terraform/examples/reference
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.8"
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform
      - name: terraform init
        run: terraform -chdir="${{ matrix.dir }}" init -backend=false -input=false
      - name: terraform validate
        run: terraform -chdir="${{ matrix.dir }}" validate

  workflow-lint:
    name: Workflow hardening lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: check_workflows.py on this workflow (fail on warnings too)
        run: python projects/devsecops-pipeline/policy/check_workflows.py .github/workflows/multi-cloud-kubernetes.yml --fail-on warning
