# Reusable DevSecOps supply-chain pipeline (projects/devsecops-pipeline).
#
# Call it from a workflow in the same repository:
#   jobs:
#     devsecops:
#       uses: ./.github/workflows/devsecops-reusable.yml
#       with: { working-directory: path/to/app, image-name: my-app }
#
# Gate order: secrets-scan, sast, sca and build run in parallel; image-scan,
# sbom and dast need the built image; sign-and-attest needs a clean scan;
# gate summarises everything and is the one required status check.
#
# Every third-party action is pinned to a full commit SHA with its release in
# a trailing comment (resolved with `git ls-remote` on 2026-10-14). Scanner
# container images are pinned by tag and index digest. Untrusted values and
# inputs reach scripts through `env:`, never through ${{ }} inside `run:`.
#
# Permissions: the caller grants a ceiling; each job below narrows it to what
# that job needs. Only the SARIF-uploading jobs get `security-events: write`,
# and only sign-and-attest gets `id-token`, `packages` and `attestations`.
name: devsecops-reusable

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory with the Dockerfile and dependency manifests (repo-relative)
        type: string
        required: true
      image-name:
        description: Image name without registry, e.g. devsecops-demo
        type: string
        required: true
      image-severity:
        description: Trivy severities that fail the image scan (comma-separated)
        type: string
        default: CRITICAL,HIGH
      sca-severity:
        description: Trivy severities that fail the dependency scan (comma-separated)
        type: string
        default: CRITICAL,HIGH
      ignore-unfixed:
        description: Only block on vulnerabilities that have a fixed version available
        type: boolean
        default: true
      trivyignore:
        description: Repo-relative path to a .trivyignore file ('' for none)
        type: string
        default: ""
      gitleaks-config:
        description: Repo-relative path to a .gitleaks.toml ('' uses gitleaks defaults)
        type: string
        default: ""
      semgrep-config:
        description: Semgrep ruleset
        type: string
        default: p/python
      enable-dast:
        description: Run an OWASP ZAP baseline scan against the built container
        type: boolean
        default: false
      zap-rules-file:
        description: Repo-relative ZAP rules TSV (IGNORE/WARN/FAIL per alert id)
        type: string
        default: ""
      app-port:
        description: Port the container listens on (for DAST)
        type: number
        default: 8080
      sonar-enabled:
        description: Run SonarQube/SonarCloud as well as Semgrep (needs SONAR_TOKEN and a server)
        type: boolean
        default: false
      sonar-host-url:
        description: SonarQube server URL
        type: string
        default: https://sonarcloud.io
      sonar-project-key:
        description: Sonar project key
        type: string
        default: ""
      sonar-organization:
        description: SonarCloud organization ('' for self-hosted SonarQube)
        type: string
        default: ""
      publish:
        # Off by default. Publishing needs a registry (GHCR here) and a push to
        # main; a portfolio repo has neither a registry it should write to nor a
        # reason to mint signing identities on every run. Turn it on in the
        # caller only for the branch that releases.
        description: Push, cosign-sign and attest the image (push to main only)
        type: boolean
        default: false
      registry:
        description: Registry for publish
        type: string
        default: ghcr.io
    secrets:
      SONAR_TOKEN:
        required: false
      SNYK_TOKEN:
        required: false
    outputs:
      image-ref:
        description: Local image reference that was built and scanned
        value: ${{ jobs.build.outputs.image-ref }}

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  SYFT_IMAGE: anchore/syft:v1.54.1@sha256:3eb5379ba7b409c3f4069b686110527af0c47df993fa5c10d13e7cf34f49b1aa
  SEMGREP_VERSION: "1.180.0"

jobs:
  secrets-scan:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans commits, not just the working tree
          persist-credentials: false
      - name: gitleaks (diff on PR/push, full history otherwise)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          CONFIG: ${{ inputs.gitleaks-config }}
        run: |
          range=""
          case "$EVENT_NAME" in
            pull_request) range="${PR_BASE}..${HEAD_SHA}" ;;
            push) [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] && range="${PUSH_BEFORE}..${HEAD_SHA}" ;;
          esac
          args=(git /repo --redact --report-format sarif --report-path /repo/gitleaks.sarif --exit-code 1)
          [ -n "$range" ] && args+=(--log-opts "$range")
          [ -n "$CONFIG" ] && args+=(--config "/repo/$CONFIG")
          echo "scope: ${range:-full history}"
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/repo" "$GITLEAKS_IMAGE" "${args[@]}"
      - name: Upload gitleaks SARIF
        if: ${{ !cancelled() && hashFiles('gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  sast:
    name: SAST (Semgrep, optional Sonar)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar needs history for blame and new-code detection
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Semgrep (pinned version)
        run: python -m pip install --no-input "semgrep==${SEMGREP_VERSION}"
      - name: semgrep scan
        env:
          WORKDIR: ${{ inputs.working-directory }}
          SEMGREP_RULES: ${{ inputs.semgrep-config }}
        run: semgrep scan --config "$SEMGREP_RULES" --sarif --output semgrep.sarif --error --metrics off "$WORKDIR"
      - name: Upload Semgrep SARIF
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      # Sonar needs a server (SonarCloud or self-hosted SonarQube) and a token.
      # Secrets cannot be read in `if:`, so a step turns "is the secret set"
      # into a boolean output without exposing the value.
      - name: Is SONAR_TOKEN set?
        id: sonar
        env:
          HAS_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
        run: echo "enabled=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
      - name: SonarQube / SonarCloud scan
        if: ${{ inputs.sonar-enabled && steps.sonar.outputs.enabled == 'true' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        with:
          projectBaseDir: ${{ inputs.working-directory }}
          args: >
            -Dsonar.projectKey=${{ inputs.sonar-project-key }}
            -Dsonar.organization=${{ inputs.sonar-organization }}
            -Dsonar.qualitygate.wait=true
      - name: Sonar skipped
        if: ${{ inputs.sonar-enabled && steps.sonar.outputs.enabled != 'true' }}
        run: echo "::warning::sonar-enabled is true but SONAR_TOKEN is not set; Sonar was skipped"

  sca:
    name: SCA (Trivy fs, optional Snyk)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache key for the Trivy DB (one per day)
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivy-cache
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      - name: trivy fs (SARIF, all severities, never fails)
        env:
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TRIVY_IMAGE" \
            fs --cache-dir /work/.trivy-cache --scanners vuln --format sarif --output trivy-fs.sarif "$WORKDIR"
      - name: Upload Trivy fs SARIF
        if: ${{ !cancelled() && hashFiles('trivy-fs.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: trivy fs gate
        env:
          WORKDIR: ${{ inputs.working-directory }}
          SEVERITY: ${{ inputs.sca-severity }}
          IGNORE_UNFIXED: ${{ inputs.ignore-unfixed }}
          IGNOREFILE: ${{ inputs.trivyignore }}
        run: |
          args=(fs --cache-dir /work/.trivy-cache --skip-db-update --scanners vuln --exit-code 1 --severity "$SEVERITY")
          [ "$IGNORE_UNFIXED" = "true" ] && args+=(--ignore-unfixed)
          [ -n "$IGNOREFILE" ] && args+=(--ignorefile "/work/$IGNOREFILE")
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TRIVY_IMAGE" "${args[@]}" "$WORKDIR"
      - name: Is SNYK_TOKEN set?
        id: snyk
        env:
          HAS_TOKEN: ${{ secrets.SNYK_TOKEN != '' }}
        run: echo "enabled=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ steps.snyk.outputs.enabled == 'true' }}
        with:
          python-version: "3.12"
      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        if: ${{ steps.snyk.outputs.enabled == 'true' }}
      - name: snyk test
        if: ${{ steps.snyk.outputs.enabled == 'true' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          python -m pip install --no-input -r requirements.txt
          snyk test --file=requirements.txt --package-manager=pip --severity-threshold=high

  build:
    name: Build image (buildx, tar artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      image-ref: ${{ steps.ref.outputs.image-ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image reference (immutable commit-SHA tag)
        id: ref
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          SHA: ${{ github.sha }}
        run: echo "image-ref=${IMAGE_NAME}:${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build to a docker-archive tar (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.working-directory }}
          push: false
          tags: ${{ steps.ref.outputs.image-ref }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          # Provenance and SBOM come from dedicated jobs below; the docker
          # exporter cannot carry BuildKit attestations anyway.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-tar
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

  image-scan:
    name: Image scan (Trivy gate)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-tar
          path: .scan
      - name: Cache key for the Trivy DB (one per day)
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivy-cache
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      - name: trivy image (SARIF, all severities, never fails)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TRIVY_IMAGE" \
            image --cache-dir /work/.trivy-cache --input .scan/image.tar --format sarif --output trivy-image.sarif
      - name: Upload Trivy image SARIF
        if: ${{ !cancelled() && hashFiles('trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: trivy image gate
        env:
          SEVERITY: ${{ inputs.image-severity }}
          IGNORE_UNFIXED: ${{ inputs.ignore-unfixed }}
          IGNOREFILE: ${{ inputs.trivyignore }}
        run: |
          args=(image --cache-dir /work/.trivy-cache --skip-db-update --input .scan/image.tar --exit-code 1 --severity "$SEVERITY")
          [ "$IGNORE_UNFIXED" = "true" ] && args+=(--ignore-unfixed)
          [ -n "$IGNOREFILE" ] && args+=(--ignorefile "/work/$IGNOREFILE")
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$TRIVY_IMAGE" "${args[@]}"

  sbom:
    name: SBOM (syft, SPDX + CycloneDX)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-tar
          path: .scan
      - name: syft
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$SYFT_IMAGE" \
            docker-archive:.scan/image.tar \
            -o spdx-json=sbom.spdx.json -o cyclonedx-json=sbom.cdx.json
          echo "packages in SBOM: $(python3 -c 'import json;print(len(json.load(open("sbom.spdx.json"))["packages"]))')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json
          if-no-files-found: error

  sign-and-attest:
    name: Publish, sign (cosign keyless) and attest (SLSA provenance)
    needs: [build, image-scan, sbom]
    # Never on pull requests: signing identities and registry writes belong to
    # the release branch only, and `publish` defaults to false (see inputs).
    if: ${{ inputs.publish && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # OIDC token for Sigstore keyless signing and attestations
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-tar
          path: .scan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: .sbom
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the scanned image (same bytes, no rebuild)
        id: push
        env:
          REGISTRY: ${{ inputs.registry }}
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ inputs.image-name }}
          LOCAL_REF: ${{ needs.build.outputs.image-ref }}
          SHA: ${{ github.sha }}
        run: |
          docker load --input .scan/image.tar
          repo="${REGISTRY}/${OWNER,,}/${IMAGE_NAME}"
          docker tag "$LOCAL_REF" "${repo}:${SHA}"
          docker push "${repo}:${SHA}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${repo}:${SHA}" | cut -d@ -f2)"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: cosign sign + SBOM attestation (keyless, by digest)
        env:
          REPO: ${{ steps.push.outputs.repo }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${REPO}@${DIGEST}"
          cosign attest --yes --type cyclonedx --predicate .sbom/sbom.cdx.json "${REPO}@${DIGEST}"
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  dast:
    name: DAST (OWASP ZAP baseline)
    needs: build
    if: ${{ inputs.enable-dast }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-tar
          path: .scan
      - name: Start the container under test
        env:
          LOCAL_REF: ${{ needs.build.outputs.image-ref }}
          APP_PORT: ${{ inputs.app-port }}
        run: |
          docker load --input .scan/image.tar
          docker run -d --name app-under-test --read-only --cap-drop ALL \
            -p "127.0.0.1:${APP_PORT}:${APP_PORT}" -e "PORT=${APP_PORT}" "$LOCAL_REF"
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:${APP_PORT}/healthz" && exit 0
            sleep 1
          done
          docker logs app-under-test
          exit 1
      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:${{ inputs.app-port }}
          rules_file_name: ${{ inputs.zap-rules-file }}
          cmd_options: -a
          fail_action: true
          allow_issue_writing: false # no `issues: write`; the report is an artifact
          artifact_name: zap-baseline
      - name: Container logs
        if: ${{ always() }}
        run: docker logs app-under-test || true

  gate:
    name: Gate (summary)
    needs: [secrets-scan, sast, sca, build, image-scan, sbom, sign-and-attest, dast]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Summarise and decide
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          # Required gates must succeed. Optional ones (gated by inputs) may be
          # skipped, but a failure still blocks.
          required = ["secrets-scan", "sast", "sca", "build", "image-scan", "sbom"]
          optional = ["dast", "sign-and-attest"]
          what = {
              "secrets-scan": "gitleaks on the diff/history",
              "sast": "Semgrep (+ Sonar if enabled)",
              "sca": "Trivy fs on manifests (+ Snyk if token)",
              "build": "buildx image to tar",
              "image-scan": "Trivy image gate",
              "sbom": "syft SPDX + CycloneDX",
              "dast": "ZAP baseline (enable-dast)",
              "sign-and-attest": "cosign + SLSA provenance (publish)",
          }
          rows, blocked = [], []
          for job in required + optional:
              result = needs.get(job, {}).get("result", "missing")
              ok = result == "success" or (job in optional and result == "skipped")
              if not ok:
                  blocked.append(job)
              rows.append(f"| `{job}` | {what[job]} | {result} | {'pass' if ok else 'BLOCK'} |")
          lines = ["## DevSecOps gate", "", "| Job | Check | Result | Gate |", "|---|---|---|---|", *rows, ""]
          lines.append(f"**Blocked by:** {', '.join(blocked)}" if blocked else "**All required gates passed.**")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          sys.exit(1 if blocked else 0)
